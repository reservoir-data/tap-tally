[build-system]
build-backend = "hatchling.build"
requires = [
  "hatchling>=1,<2",
]

[project]
name = "tap-tally"
version = "0.0.1"
description = "Singer tap for Tally, built with the Meltano Singer SDK."
readme = "README.md"
keywords = [
  "ELT",
  "Tally",
]
license = "Apache-2.0"
license-files = [ "LICENSE" ]
requires-python = ">=3.12"
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "requests~=2.34.0",
  "singer-sdk~=0.55.0a1",
]
[[project.authors]]
name = "Edgar Ramírez-Mondragón"
email = "edgarrm358@gmail.com"
[project.optional-dependencies]
s3 = [
  "s3fs~=2026.6.0",
]
[project.scripts]
# CLI declaration
tap-tally = "tap_tally.tap:TapTally.cli"

[dependency-groups]
dev = [
  { include-group = "test" },
]
test = [
  "pytest>=9",
  "pytest-github-actions-annotate-failures>=0.3",
  "singer-sdk[testing]",
]
typing = [
  "mypy>=1.16",
  "ty>=0.0.1a16",
]

[tool.ruff]
required-version = ">=0.16"
line-length = 100
preview = true
[tool.ruff.lint]
future-annotations = true
ignore = [
  "missing-trailing-comma",
]
select = [ "ALL" ]
[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyproject-fmt]
max_supported_python = "3.15"
table_format = "long"

[tool.mypy]
warn_unreachable = true
enable_error_code = [ "ignore-without-code", "redundant-expr", "truthy-bool" ]
strict = true
warn_unused_configs = true

[tool.pytest]
addopts = [
  "--durations=10",
  "-ra",
]
filterwarnings = [
  "error",
  "once:Fields in transformed catalog but not in records:UserWarning",
]
log_level = "INFO"
minversion = "9"
strict = true
testpaths = [ "tests" ]

# This configuration can be used to customize tox tests as well as other test frameworks like flake8 and mypy
[tool.tox]
requires = [
  "tox>=4.55",
  "tox-uv>=1.35",
]
env_list = [
  "test",
  "typing",
]
[tool.tox.env.test]
description = "run tests on Python {py_dot_ver}"
base_python_file = [ ".python-version" ]
[tool.tox.env.typing]
description = "type checks"
dependency_groups = [ "test", "typing" ]
commands = [
  [ "mypy", { replace = "posargs", default = [ "tap_tally", "tests" ], extend = true } ],
  [ "ty", "check", { replace = "posargs", default = [ "tap_tally", "tests" ], extend = true } ],
]
[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
dependency_groups = [ "test" ]
pass_env = [
  "GITHUB_*",
  "TAP_TALLY_*",
]
commands = [ [ "pytest", { replace = "posargs", default = [ "tests" ], extend = true } ] ]
